<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Formulaires Netlify — ONG Akoum Gold</title>
  </head>
  <body>
    <!--
      Page technique, invisible pour les visiteurs : elle déclare à Netlify Forms
      les formulaires du site et leurs champs. Le formulaire de pages/contact.js
      envoie ses messages ici (POST /__forms.html). Si vous ajoutez un champ au
      formulaire de contact, ajoutez-le aussi ci-dessous.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
